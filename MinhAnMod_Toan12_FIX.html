<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>MINH AN MOD • TOÁN 12</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101c;color:#edf5ff;font-family:system-ui,-apple-system,sans-serif}header{text-align:center;padding:24px 12px;background:linear-gradient(135deg,#10243a,#10132b);border-bottom:1px solid #24415e}h1{margin:0;font-size:clamp(22px,5vw,30px);color:#5cf2d0;text-shadow:0 0 15px #14b8a6}header p{color:#a8bfd8;margin:8px 0 0}.wrap{max-width:900px;margin:auto;padding:14px}.panel{background:#101e30;border:1px solid #29415e;border-radius:16px;padding:14px;margin-bottom:14px}select,button{font:inherit;padding:11px;border:0;border-radius:10px}select{width:100%;background:#203650;color:#fff;margin:8px 0}button{background:#55e4c3;color:#05251e;font-weight:750;cursor:pointer}.secondary{background:#29415e;color:#eaf3ff}.gold{background:#ffc857;color:#332100}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.bar button{flex:1}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#9eb5d0;font-size:14px}.timer{color:#ffc857;font-weight:800;font-size:19px}.question{padding:14px 0;border-bottom:1px solid #2b405a}.question:last-child{border:0}.qt{font-weight:700;line-height:1.55;margin-bottom:10px}.opt{display:block;padding:10px;margin:6px 0;background:#172940;border-radius:10px;cursor:pointer;line-height:1.45}.opt input{accent-color:#55e4c3;margin-right:8px}.graph{display:block;width:100%;max-width:520px;height:240px;background:#091625;border:1px solid #29415e;border-radius:12px;margin:10px auto}.explain{color:#b7d2e9;font-size:14px;line-height:1.6;margin-top:10px}.result{background:#10352f;border:1px solid #267265;border-radius:12px;padding:14px;margin-top:12px}.pill{display:inline-block;background:#203650;color:#bceee4;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}footer{text-align:center;color:#91a8c3;font-size:12px;padding:18px}@media(min-width:650px){select{width:auto;min-width:220px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}}
</style></head><body><header><h1>⚡ MINH AN MOD • TOÁN 12</h1><p>Ôn giữa kì I · Đồ thị · Bảng biến thiên · Tự chấm</p></header><main class="wrap"><section class="panel top"><div><b>Chọn đề luyện tập</b><select id="exam"></select><div class="meta"><span id="progress">0/10 câu</span><span class="timer" id="timer">90:00</span></div></div><div class="bar"><button class="secondary" id="reset">Làm lại</button><button class="gold" id="submit">Nộp bài</button></div></section><section class="panel"><div class="meta"><span>10 câu / 10 điểm</span><span>Chọn đáp án A–D</span></div><div id="questions"></div><div id="result"></div></section><footer>MINH AN MOD · Bản luyện tập mô phỏng, không phải đề chính thức.</footer></main>
<script>
const pool=[
{t:'Đồ thị minh họa: hàm số y=x³−3x. Hàm số nghịch biến trên khoảng nào?',o:['(−∞;−1)','(−1;1)','(1;+∞)','R'],a:1,e:'y′=3(x²−1). y′<0 khi −1<x<1.',g:'cubic'},
{t:'Cho y=x³−3x²+2. Hàm số đồng biến trên:',o:['(−∞;0) và (2;+∞)','(0;2)','(−∞;2)','R'],a:0,e:'y′=3x(x−2), dương khi x<0 hoặc x>2.',g:'cubic'},
{t:'Đạo hàm y=(x²+1)/(x−1) là:',o:['(x²−2x−1)/(x−1)²','(x²+1)/(x−1)²','2x/(x−1)','1'],a:0,e:'Quy tắc thương: [2x(x−1)−(x²+1)]/(x−1)².',g:'none'},
{t:'Hàm y=x³−3x có cực đại tại x bằng:',o:['−1','1','0','3'],a:0,e:'y′=3(x²−1), đổi dấu + sang − tại x=−1.',g:'cubic'},
{t:'GTLN của y=−x²+4x+1 là:',o:['1','4','5','−3'],a:2,e:'y=−(x−2)²+5 nên GTLN là 5.',g:'parabola'},
{t:'Tiệm cận đứng của y=(2x+1)/(x−3) là:',o:['x=−1/2','x=3','y=2','Không có'],a:1,e:'Mẫu bằng 0 tại x=3, tử khác 0.',g:'none'},
{t:'Tiệm cận ngang của y=(3x−1)/(x+2) là:',o:['y=−2','y=2','y=3','x=3'],a:2,e:'Tử và mẫu cùng bậc; lấy tỉ số hệ số bậc cao nhất.',g:'none'},
{t:'Đạo hàm y=√(4−x²) là:',o:['x/√(4−x²)','−x/√(4−x²)','−2x/√(4−x²)','1/√(4−x²)'],a:1,e:'y′=−2x/[2√(4−x²)]=−x/√(4−x²).',g:'semicircle'},
{t:'Đồ thị y=x²−4 có giao điểm với trục Ox là:',o:['x=±2','x=0','x=±4','Không giao'],a:0,e:'Giải x²−4=0 ⇒ x=−2 hoặc x=2.',g:'parabola'},
{t:'y=x/(x²+1) đồng biến trên:',o:['(−∞;−1)','(−1;1)','(1;+∞)','R'],a:1,e:'y′=(1−x²)/(x²+1)² >0 khi −1<x<1.',g:'rational'},
{t:'Bảng dấu y′: (+) trước x=1, (−) sau x=1. Kết luận tại x=1:',o:['Cực tiểu','Cực đại','Không có cực trị','Tiệm cận'],a:1,e:'Đạo hàm đổi dấu từ dương sang âm ⇒ cực đại.',g:'table'},
{t:'y=x⁴−4x² có bao nhiêu điểm cực trị?',o:['1','2','3','4'],a:2,e:'y′=4x(x²−2), có ba nghiệm đổi dấu: −√2,0,√2.',g:'quartic'},
{t:'GTNN của x²−6x+11 là:',o:['1','2','3','11'],a:1,e:'x²−6x+11=(x−3)²+2 ⇒ GTNN 2.',g:'parabola'},
{t:'Tiếp tuyến đồ thị y=x² tại x=1 là:',o:['y=2x−1','y=x+1','y=2x+1','y=x'],a:0,e:'f(1)=1, f′(1)=2 ⇒ y−1=2(x−1).',g:'parabola'},
{t:'Nếu f′(x)<0 trên khoảng I thì f:',o:['Đồng biến','Nghịch biến','Không đổi','Có cực đại'],a:1,e:'Đạo hàm âm trên khoảng ⇒ hàm nghịch biến.',g:'none'},
{t:'Giới hạn (2x²+1)/(x²−3) khi x→+∞ bằng:',o:['0','1','2','−2'],a:2,e:'Chia cả tử và mẫu cho x², giới hạn bằng 2.',g:'none'},
{t:'y=−2x²+8x−3 đạt giá trị lớn nhất bằng:',o:['3','5','8','−3'],a:1,e:'y=−2(x−2)²+5 ⇒ GTLN 5.',g:'parabola'},
{t:'Tập xác định của y=√(4−x²) là:',o:['R','[−2;2]','(−2;2)','[0;2]'],a:1,e:'4−x²≥0 ⇒ −2≤x≤2.',g:'semicircle'},
{t:'N(t)=(20t+5)/(t+2). Giới hạn khi t→∞ là:',o:['5','10','20','2'],a:2,e:'Tỉ số hệ số của t là 20.',g:'none'},
{t:'Đồ thị parabol y=−(x−2)²+3 có đỉnh:',o:['(−2;3)','(2;3)','(2;−3)','(0;3)'],a:1,e:'Dạng y=a(x−h)²+k có đỉnh (h;k).',g:'parabola'},
{t:'y=x³ có điểm uốn tại:',o:['x=0','x=1','x=−1','Không có'],a:0,e:'y″=6x đổi dấu tại x=0.',g:'cubic'},
{t:'Nếu bảng biến thiên cho f tăng rồi giảm rồi tăng, số cực trị là:',o:['0','1','2','3'],a:2,e:'Có hai lần đổi chiều: cực đại và cực tiểu.',g:'table'},
{t:'Đạo hàm y=(3x−1)⁵ là:',o:['5(3x−1)⁴','15(3x−1)⁴','3(3x−1)⁴','15(3x−1)⁵'],a:1,e:'Dây chuyền: 5(3x−1)⁴·3.',g:'none'},
{t:'Trên [0;3], GTNN của x²−2x là:',o:['−1','0','1','3'],a:0,e:'x²−2x=(x−1)²−1; x=1 thuộc đoạn.',g:'parabola'}];
const exams=Array.from({length:12},(_,i)=>Array.from({length:10},(_,j)=>pool[(i*3+j*2)%pool.length]));const select=document.querySelector('#exam'),qbox=document.querySelector('#questions'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),timer=document.querySelector('#timer');for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i-1;o.textContent='Đề '+String(i).padStart(2,'0');select.append(o)}let left=5400,iv,done=false;
function graph(kind,canvas){let c=canvas.getContext('2d'),w=canvas.width=520,h=canvas.height=240;c.clearRect(0,0,w,h);c.strokeStyle='#203650';for(let x=20;x<w;x+=26){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=20;y<h;y+=25){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}c.strokeStyle='#a5bdd5';c.lineWidth=2;c.beginPath();c.moveTo(20,h/2);c.lineTo(w-15,h/2);c.moveTo(w/2,h-15);c.lineTo(w/2,12);c.stroke();c.fillStyle='#a5bdd5';c.fillText('x',w-20,h/2-8);c.fillText('y',w/2+8,18);c.strokeStyle='#55e4c3';c.lineWidth=3;c.beginPath();for(let px=0;px<w;px++){let x=(px-w/2)/55,y=kind==='parabola'?-.18*x*x+1.4:kind==='cubic'? .13*x*x*x-.5*x:kind==='quartic'?.04*x*x*x*x-.5*x*x:kind==='semicircle'?Math.sqrt(Math.max(0,4-x*x)):kind==='rational'?x/(x*x+1):Math.sin(x);let py=h/2-y*36;if(px===0)c.moveTo(px,py);else c.lineTo(px,py)}c.stroke()}
function render(){done=false;result.innerHTML='';qbox.innerHTML='';left=5400;timer.textContent='90:00';clearInterval(iv);let data=exams[+select.value];data.forEach((q,i)=>{let d=document.createElement('article');d.className='question';d.innerHTML=`<div class="qt">Câu ${i+1}. ${q.t}</div>`;if(q.g!=='none'){let cv=document.createElement('canvas');cv.className='graph';cv.setAttribute('aria-label','Đồ thị minh họa');d.append(cv);graph(q.g,cv)}d.innerHTML+=q.o.map((a,k)=>`<label class="opt"><input type="radio" name="q${i}" value="${k}"><b>${'ABCD'[k]}.</b> ${a}</label>`).join('');qbox.append(d)});progress.textContent='Đã chọn 0/10 câu';qbox.querySelectorAll('input').forEach(x=>x.onchange=()=>progress.textContent=`Đã chọn ${qbox.querySelectorAll('input:checked').length}/10 câu`);iv=setInterval(()=>{if(done)return;left--;timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)submit()},1000)}
function submit(){if(done)return;done=true;clearInterval(iv);let score=0;exams[+select.value].forEach((q,i)=>{let ans=qbox.querySelector(`input[name=q${i}]:checked`),ok=ans&&+ans.value===q.a;if(ok)score++;let labels=qbox.querySelectorAll('.question')[i].querySelectorAll('.opt');labels[q.a].style.border='1px solid #55e4c3';if(ans&&!ok)labels[+ans.value].style.border='1px solid #ff657a';let e=document.createElement('div');e.className='explain';e.innerHTML=`<b>${ok?'✅ Đúng':'❌ Sai'} · Đáp án ${'ABCD'[q.a]}.</b> ${q.e}`;qbox.querySelectorAll('.question')[i].append(e)});result.innerHTML=`<div class="result"><h2>🎯 ${score}/10 điểm</h2><p>Đúng ${score}/10 câu. Xem phần giải thích dưới từng câu để ôn lại.</p><button onclick="window.scrollTo({top:0,behavior:'smooth'})">Lên đầu trang</button></div>`}document.querySelector('#submit').onclick=submit;document.querySelector('#reset').onclick=render;select.onchange=render;render();
</script></body></html>
